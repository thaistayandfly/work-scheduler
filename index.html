<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">Shift<span>Board</span></div>
    <div id="authArea" class="auth-area">
      <button id="signInBtn" class="btn-ghost">Sign in with Google</button>
      <span id="userEmail" class="user-email" hidden></span>
    </div>
  </header>

  <div id="controls" class="controls" hidden>
    <div class="calendar-select">
      <label for="calendarSelect">Calendar</label>
      <select id="calendarSelect"></select>
      <button id="newCalendarBtn" class="btn-text" type="button">+ New calendar</button>
    </div>
    <div class="week-nav">
      <button id="prevWeek" class="nav-arrow" aria-label="Previous week" type="button">&#8249;</button>
      <div id="weekLabel" class="week-label"></div>
      <button id="nextWeek" class="nav-arrow" aria-label="Next week" type="button">&#8250;</button>
    </div>
  </div>

  <main id="weekGrid" class="week-grid" hidden></main>

  <p id="emptyState" class="empty-state" hidden>Sign in with Google to load your week.</p>

  <footer id="saveBar" class="save-bar" hidden>
    <div id="statusText" class="status-text">No changes yet</div>
    <button id="saveBtn" class="btn-primary" type="button">Save changes</button>
  </footer>

</div>

<div id="toast" class="toast" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
